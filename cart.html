<!DOCTYPE html><html><head><meta charset="utf-8">
    <style>
    
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
                 'SF Pro Text', 'Roboto', 'Segoe UI',
                 'Helvetica Neue', Arial, sans-serif;
    color: #1c1c1e;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

      body {
        
    background:
      radial-gradient(1200px 800px at 10% 10%,
                      rgba(175, 82, 222, 0.45) 0%, transparent 55%),
      radial-gradient(1000px 700px at 95% 20%,
                      rgba(10, 132, 255, 0.50) 0%, transparent 55%),
      radial-gradient(900px 700px at 20% 100%,
                      rgba(255, 55, 95, 0.40) 0%, transparent 55%),
      radial-gradient(900px 700px at 100% 100%,
                      rgba(255, 159, 10, 0.35) 0%, transparent 55%),
      linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);

        padding: 24px;
        display: flex; align-items: center; justify-content: center;
      }
      .receipt {
        width: 100%; max-width: 600px;
        border-radius: 32px; overflow: hidden;
        background: rgba(255,255,255,0.72);
        -webkit-backdrop-filter: blur(36px) saturate(200%);
                backdrop-filter: blur(36px) saturate(200%);
        border: 1px solid rgba(255,255,255,0.85);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.9) inset,
          0 -1px 0 rgba(255,255,255,0.3) inset,
          0 20px 50px rgba(16,24,40,0.2),
          0 40px 100px rgba(16,24,40,0.15);
      }
      .r-head {
        padding: 24px 28px;
        background: linear-gradient(135deg, #AF52DE 0%, #FF375F 100%);
        color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }
      .r-head-left { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
      .r-head-left > * + * { margin-left: 14px; }
      .r-head-icon {
        width: 44px; height: 44px;
        background: rgba(255,255,255,0.22);
        -webkit-backdrop-filter: blur(16px);
                backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset;
      }
      .r-head-icon svg { width: 22px; height: 22px; stroke: #fff; }
      .r-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
      .r-sub   { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.85);
                  text-transform: uppercase; letter-spacing: 1.4px; margin-top: 4px; }
      .r-count {
        padding: 8px 14px;
        background: rgba(255,255,255,0.22);
        -webkit-backdrop-filter: blur(16px);
                backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        font-size: 12px; font-weight: 700; letter-spacing: 0.6px;
      }

      .r-body { padding: 12px 20px; }
      .line {
        display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
        padding: 14px 8px;
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }
      .line:last-child { border-bottom: none; }
      .l-icon {
        width: 44px; height: 44px; border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.3);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 10px rgba(0,0,0,0.15);
      }
      .l-icon svg { width: 22px; height: 22px; stroke: #fff; }
      .l-icon { margin-right: 14px; }
      .l-info { flex: 1; }
      .l-name  { font-size: 16px; font-weight: 600; color: #1c1c1e;
                  letter-spacing: -0.1px; }
      .l-aisle { font-size: 11px; font-weight: 700; color: #8E8E93;
                  text-transform: uppercase; letter-spacing: 0.8px; margin-top: 3px; }
      .l-price { font-size: 16px; font-weight: 700; color: #1c1c1e;
                  white-space: nowrap; }

      .r-total {
        padding: 20px 28px;
        background: rgba(175,82,222,0.08);
        border-top: 2px dashed rgba(175,82,222,0.3);
        display: flex; justify-content: space-between; align-items: center;
      }
      .t-label { font-size: 12px; font-weight: 700; color: #5E1B90;
                  text-transform: uppercase; letter-spacing: 1.4px; }
      .t-value { font-size: 32px; font-weight: 700; color: #1c1c1e;
                  letter-spacing: -0.8px; }

      .r-hint {
        padding: 16px 28px;
        background: rgba(255,255,255,0.5);
        border-top: 1px solid rgba(0,0,0,0.05);
        font-size: 14px; color: #3A3A3C; text-align: center;
      }
      .r-hint strong { color: #AF52DE; font-weight: 700; }
    </style></head><body>

    <div class="receipt">
      <div class="r-head">
        <div class="r-head-left">
          <div class="r-head-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
            </svg>
          </div>
          <div>
            <div class="r-title">Your Cart</div>
            <div class="r-sub">ShopMate Session</div>
          </div>
        </div>
        <div class="r-count">3 items</div>
      </div>

      <div class="r-body">
        
        <div class="line">
          <div class="l-icon" style="background: linear-gradient(135deg, #30B0C7 0%, #0F5869 100%);"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M8 2h8v4l2 3v11a2 2 0 01-2 2H8a2 2 0 01-2-2V9l2-3V2z"/><path d="M6 9h12"/></svg></div>
          <div class="l-info">
            <div class="l-name">Whole Milk (1L)</div>
            <div class="l-aisle">Dairy Aisle</div>
          </div>
          <div class="l-price">€1.29</div>
        </div>
        <div class="line">
          <div class="l-icon" style="background: linear-gradient(135deg, #FF9F0A 0%, #8A4F00 100%);"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M5 18h14a2 2 0 002-2c0-2-3-3-3-6 0-2-1-4-4-4h-4c-3 0-4 2-4 4 0 3-3 4-3 6a2 2 0 002 2z"/><path d="M9 18v2a1 1 0 001 1h4a1 1 0 001-1v-2"/></svg></div>
          <div class="l-info">
            <div class="l-name">White Bread Loaf</div>
            <div class="l-aisle">Bakery Aisle</div>
          </div>
          <div class="l-price">€1.49</div>
        </div>
        <div class="line">
          <div class="l-icon" style="background: linear-gradient(135deg, #34C759 0%, #0F5D23 100%);"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="7"/><path d="M12 7V3"/><path d="M15 5c-1 1-3 1.5-5 .5"/></svg></div>
          <div class="l-info">
            <div class="l-name">Red Apples (1kg)</div>
            <div class="l-aisle">Produce Aisle</div>
          </div>
          <div class="l-price">€2.29</div>
        </div>
      </div>

      <div class="r-total">
        <div class="t-label">Total</div>
        <div class="t-value">€5.07</div>
      </div>

      <div class="r-hint">
        Say <strong>&ldquo;done&rdquo;</strong> or <strong>&ldquo;that&rsquo;s all&rdquo;</strong> when ready, or add more items
      </div>
    </div>

    </body></html>
